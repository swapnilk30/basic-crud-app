spring.application.name=basic-crud-app


# ============================================================
# Datasource ? H2 (dev)
# ============================================================
spring.datasource.url=jdbc:h2:mem:crud_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# H2 Console (dev only ? lock down in prod)
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET:change-me-to-a-64-char-minimum-secret-please-1234567890abcdef}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.issuer=basic-crud-app

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true





#Spring Boot 3.5 + Java 17 + JPA + H2/MySQL + Validation + Security